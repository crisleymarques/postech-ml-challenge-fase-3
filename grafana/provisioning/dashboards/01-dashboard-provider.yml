apiVersion: 1

providers:
  - name: 'Urgencia Medica Default Dashboards'
    uid: urgencia-default
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
