global:
  scrape_interval: 10s
  evaluation_interval: 15s
  scrape_timeout: 5s

  external_labels:
    monitor: 'urgencia-medica-monitor'
    environment: 'local-dev'

rule_files:

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'urgencia-api'
    metrics_path: /metrics
    honor_labels: true
    static_configs:
      - targets:
          - 'api:8000'
        labels:
          service: 'urgencia-medica-api'
          component: 'fastapi-inference'
          environment: 'local'
