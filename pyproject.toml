[project]
name = "postech-ml-challenge-fase-3"
version = "0.1.0"
description = "Triagem automática de urgência em laudos médicos via NLP"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "ipython>=9.17.1",
    "joblib>=1.6.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "nltk>=3.10.3",
    "numpy>=2.5.3",
    "onnx>=1.16.0,<1.19.0",
    "onnxruntime>=1.30.0",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "skl2onnx>=1.20.0",
    "uvicorn[standard]>=0.53.0",
    "wordcloud>=1.9.6",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sources*", "pipelines*", "app*"]
